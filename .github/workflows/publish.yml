name: build and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # weekly: picks up Debian security updates
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aeon-buildbase:ci
      - name: verify
        run: docker run --rm -v "$PWD":/src -w /src aeon-buildbase:ci ./verify.sh
      - name: login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dwizzle2009/aeon-buildbase:latest
            ghcr.io/dwizzle2009/aeon-buildbase:trixie
            ghcr.io/dwizzle2009/aeon-buildbase:2026.10
